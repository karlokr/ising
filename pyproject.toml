[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ising"
version = "0.2.0"
description = "Monte Carlo simulation of the 1D and 2D Ising model (Metropolis and Wolff)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Karlo Krakan", email = "karlo@krakan.ca" }]
dependencies = ["numpy>=1.24", "numba>=0.59", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ising = "ising.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: statistical tests that take a few seconds"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
